name: Python CI

on:
  push:
    branches:
      - main

jobs:
  python-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
         
      - name: List files
        run: |
         pwd
         ls -R



     
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python Version
        run: python --version

      - name: Run Python Program
        run: python app.py